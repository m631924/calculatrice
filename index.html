<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Calculette</h1>
    <h2>Par: Luis Fernando Meza Flor</h2>
    <div id="container">
        <div id="outdisplay"><p id="display">0</p></div>
        <p>
        <div class="linebutton">
            <button id="clear" >Clear</button>
            <button id="change">+/-</button>
            <button id="percent">%</button>
            <button id="divide">/</button>
        </div>
        <div class="linebutton">
            <button id="n7">7</button>
            <button id="n8">8</button>
            <button id="n9">9</button>
            <button id="multiply">x</button>
        </div>
        <div class="linebutton">
            <button id="n4">4</button>
            <button id="n5">5</button>
            <button id="n6">6</button>
            <button id="minus">-</button>
        </div>
        <div class="linebutton">
            <button id="n1">1</button>
            <button id="n2">2</button>
            <button id="n3">3</button>
            <button id="plus">+</button>
        </div>
        <div class="linebutton">
            <button id="n0">0</button>
            <button id="period">.</button>
            <button id="result" class="doublebutton">=</button>
        </div>
        </p>
    </div>
    <script src="script.js"></script>
</body>
</html>
